services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragplatform
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── RAG Platform API ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ragplatform
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      - output_data:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ── Telegram Bot ───────────────────────────────────────────────────────
  telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-telegram
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    command: python telegram_bot.py
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  # ── WhatsApp Bot ───────────────────────────────────────────────────────
  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-whatsapp
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      OPENWA_BASE_URL: http://openwa-api:2785
      OPENWA_API_KEY: ${OPENWA_API_KEY:-owa_k1_3402c841e8eaef19ca0fccce89d07d9520ee8aec6f582e2fd0c56dba3bccbb96}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-bot}
      WEBHOOK_URL: http://rag-whatsapp:9000/webhook
    command: python whatsapp_bot.py
    ports:
      - "9000:9000"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - openwa-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  output_data:

networks:
  default:
  openwa-network:
    external: true
    name: openwa-network
